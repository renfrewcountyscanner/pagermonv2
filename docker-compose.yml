services:
  postgres:
    image: postgres:16-alpine
    container_name: pagermon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-pagermon}
      POSTGRES_USER: ${PG_USER:-pagermon}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-change-me}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-pagermon} -d ${PG_DATABASE:-pagermon}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pagermon-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: pagermon-server:latest
    container_name: pagermon-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-3000}:3000"
    volumes:
      - ./server-data:/config
    environment:
      - NODE_ENV=production
      - TZ=${TZ:-UTC}
      - DATABASE__TYPE=pg
      - DATABASE__SERVER=postgres
      - DATABASE__PORT=5432
      - DATABASE__DATABASE=${PG_DATABASE:-pagermon}
      - DATABASE__USERNAME=${PG_USER:-pagermon}
      - DATABASE__PASSWORD=${PG_PASSWORD:-change-me}
      - PUBLICMAP__BASEURL=${PUBLIC_MAP_BASE_URL:-http://localhost:5000}
      - PUBLICMAP__APIKEY=${PUBLIC_MAP_API_KEY:-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  public-map:
    build:
      context: ./public_map
      dockerfile: Dockerfile
    image: pagermon-public-map:latest
    container_name: pagermon-public-map
    restart: unless-stopped
    ports:
      - "${MAP_PORT:-5000}:5000"
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DATABASE=${PG_DATABASE:-pagermon}
      - PG_USER=${PG_USER:-pagermon}
      - PG_PASSWORD=${PG_PASSWORD:-change-me}
      - BASE_URL=${PUBLIC_MAP_BASE_URL:-http://localhost:5000}
      - SECRET_KEY=${MAP_SECRET_KEY:-change-me}
      - PUBLIC_MAP_API_KEY=${PUBLIC_MAP_API_KEY:-change-me}
      - MAP_LAT=${MAP_LAT:-45.42}
      - MAP_LNG=${MAP_LNG:-75.70}
    depends_on:
      postgres:
        condition: service_healthy

  pagermon-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: pagermon-client:latest
    container_name: pagermon-client
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - ./client-data:/config
    environment:
      - NODE_ENV=production
      - RTL_DEVICE=${RTL_DEVICE:-0}
      - RTL_FREQ=${RTL_FREQ:-148.5875M}
      - POCSAG_MODE=${POCSAG_MODE:-POCSAG512}
    depends_on:
      pagermon-server:
        condition: service_healthy
    profiles:
      - client
