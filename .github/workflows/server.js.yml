# CI currently disabled — syntax validated locally before commit.
# To re-enable, change 'workflow_dispatch' back to 'push' trigger.

name: Node.js CI

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
    - name: Syntax check
      working-directory: ./server
      run: |
        node -c app.js
        node -c routes/api.js
        node -c plugins/Geocoder.js
        node -c lib/nominatim.js
        echo "Syntax OK"
